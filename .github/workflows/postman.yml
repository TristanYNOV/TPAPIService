name: Postman E2E

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  postman-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Copy .env
        shell: bash
        run: |
          # 1) Copier .env.example -> .env si présent, sinon créer un .env minimal
          if [ -f ".env.example" ]; then
            cp .env.example .env
          else
            {
              echo 'DATABASE_URL="file:./dev.db"'
              echo 'JWT_SECRET="change-me"'
              echo 'JWT_EXPIRES_IN="1d"'
            } > .env
          fi

          # 2) S'assurer que DATABASE_URL et JWT_EXPIRES_IN existent (valeurs par défaut si absentes)
          grep -q '^DATABASE_URL=' .env || echo 'DATABASE_URL="file:./dev.db"' >> .env
          grep -q '^JWT_EXPIRES_IN=' .env || echo 'JWT_EXPIRES_IN="1d"' >> .env

          # 3) Si un secret GitHub JWT_SECRET est fourni, l'injecter/écraser proprement
          if [ -n "${{ secrets.JWT_SECRET }}" ]; then
            if grep -q '^JWT_SECRET=' .env; then
              sed -i 's/^JWT_SECRET=.*/JWT_SECRET="${{ secrets.JWT_SECRET }}"/' .env
            else
              echo 'JWT_SECRET="${{ secrets.JWT_SECRET }}"' >> .env
            fi
          fi

          echo "Final .env content (secrets masqués par GitHub):"
          sed 's/^JWT_SECRET=.*/JWT_SECRET="***"/' .env

      # (Optionnel) Debug rapide pour vérifier le cwd et la présence des fichiers
      - name: Debug workspace
        run: |
          pwd
          ls -la
          ls -la prisma || true
          echo "DATABASE_URL from .env (masked in logs by GitHub):"
          grep '^DATABASE_URL=' .env || true

      - name: Generate Prisma client
        run: npx prisma generate --schema=./prisma/schema.prisma
        env:
          DATABASE_URL: "file:./dev.db"

      - name: Prepare DB (SQLite)
        run: npx prisma migrate dev --name init --schema=./prisma/schema.prisma
        env:
          DATABASE_URL: "file:./dev.db"

      - name: Run Postman collection (start app, then newman)
        run: npm run ci:e2e
        env:
          # Secrets/vars nécessaires à l'app :
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: "1d"
          DATABASE_URL: "file:./dev.db"

      - name: Upload JUnit report
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: newman-report.xml
